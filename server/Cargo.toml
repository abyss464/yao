[package]
name = "yao"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "yaod"
path = "src/main.rs"

[[bin]]
name = "yao"
path = "src/bin/yao.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
evdev = "0.13"
hex = "0.4"
if-addrs = "0.13"
mdns-sd = "0.13"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
toml = "0.8"

[profile.release]
opt-level = 3
strip = true
